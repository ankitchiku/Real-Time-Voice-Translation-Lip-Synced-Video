version: '3.8'

services:
  upload:
    build:
      context: ./services/upload
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=104857600
      - CHUNK_SIZE=8388608
    networks:
      - pipeline-network
    restart: unless-stopped

  processing:
    build:
      context: ./services/processing
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./models:/app/models
    environment:
      - OUTPUT_DIR=/app/outputs
      - UPLOAD_DIR=/app/uploads
      - MODEL_DIR=/app/models
      - WHISPER_MODEL=base
      - USE_GPU=false
    networks:
      - pipeline-network
    restart: unless-stopped
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  media:
    build:
      context: ./services/media
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    volumes:
      - ./outputs:/app/outputs
    environment:
      - MEDIA_DIR=/app/outputs
    networks:
      - pipeline-network
    restart: unless-stopped

networks:
  pipeline-network:
    driver: bridge

volumes:
  uploads:
  outputs:
  models: